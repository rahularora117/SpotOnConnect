name: spoton_connect
description: Meet People Around You
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^16.2.1

  # Backend
  supabase_flutter: ^2.10.0

  # Maps
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Permissions
  permission_handler: ^12.0.1

  # UI
  flutter_svg: ^2.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7

  # JSON
  json_annotation: ^4.9.0

  # Bluetooth (Future)
  flutter_blue_plus: ^1.35.5

  # Notifications
  flutter_local_notifications: ^19.4.0

  # Image Picker
  image_picker: ^1.2.0

  # Storage
  shared_preferences: ^2.5.3

  # Connectivity
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.7.1
  json_serializable: ^6.11.1

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/