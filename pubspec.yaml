name: spoton
description: SpotOn - Meet People Around You
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ----------------------------
  # State Management
  # ----------------------------
  flutter_riverpod: ^2.6.1

  # ----------------------------
  # Navigation
  # ----------------------------
  go_router: ^16.0.0

  # ----------------------------
  # Backend
  # ----------------------------
  supabase_flutter: ^2.9.1

  # ----------------------------
  # Maps
  # ----------------------------
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^1.4.0

  # ----------------------------
  # Location
  # ----------------------------
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # ----------------------------
  # Bluetooth
  # ----------------------------
  flutter_blue_plus: ^1.35.5

  # ----------------------------
  # Images
  # ----------------------------
  image_picker: ^1.2.0
  cached_network_image: ^3.4.1

  # ----------------------------
  # Permissions
  # ----------------------------
  permission_handler: ^12.0.1

  # ----------------------------
  # Fonts
  # ----------------------------
  google_fonts: ^6.3.1

  # ----------------------------
  # Animations
  # ----------------------------
  flutter_animate: ^4.5.2
  lottie: ^3.3.1

  # ----------------------------
  # UI
  # ----------------------------
  flutter_svg: ^2.2.0
  shimmer: ^3.0.0

  # ----------------------------
  # Utilities
  # ----------------------------
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.6.0

  # ----------------------------
  # Firebase
  # ----------------------------
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

  # ----------------------------
  # Storage
  # ----------------------------
  path_provider: ^2.1.5

  # ----------------------------
  # Connectivity
  # ----------------------------
  connectivity_plus: ^6.1.4

  # ----------------------------
  # Local Storage
  # ----------------------------
  shared_preferences: ^2.5.3

  # ----------------------------
  # Notifications
  # ----------------------------
  flutter_local_notifications: ^19.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700